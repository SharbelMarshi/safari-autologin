<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLogin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <section class="popup-shell">
        <h1>AUTOLOGIN</h1>
        <p id="popupContext" class="field-help"></p>

        <div class="popup-divider"></div>

        <p id="popupStatus" class="status hidden" aria-live="polite"></p>

        <div id="fieldList" class="field-list"></div>
        <button id="addField" class="secondary add-field-button" type="button">+ Add Another Field</button>

        <div class="popup-divider"></div>

        <p class="field-help">Fills and signs in automatically when you visit this site's login page.</p>

        <div class="actions">
          <button id="save">Save Credentials</button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
