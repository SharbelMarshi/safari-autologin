<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLogin Options</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="options">
      <section class="hero-card hero-card-wide">
        <div>
          <p class="eyebrow">AutoLogin</p>
          <h1>Saved Site Rules</h1>
          <p class="hero-copy">Review, edit, or remove credentials saved for individual sites on this Mac.</p>
        </div>
        <div class="header-actions">
          <button id="clearAll" class="secondary">Clear All</button>
          <button id="resetData" class="danger">Reset Extension Data</button>
        </div>
      </section>

      <p id="optionsStatus" class="status hidden" aria-live="polite"></p>

      <section id="emptyState" class="empty-state hidden">
        <h2>No saved sites yet</h2>
        <p>Credentials and login-page rules you save from the popup will appear here for review.</p>
      </section>

      <div id="rules" class="rules-grid"></div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
