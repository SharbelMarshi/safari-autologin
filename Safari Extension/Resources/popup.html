<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLogin</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup">
      <section class="hero-card">
        <div class="hero-copy">
          <p class="eyebrow">AutoLogin</p>
          <h1>Quick Fill</h1>
        </div>
        <p id="hostname" class="hostname">loading…</p>
      </section>

      <section class="panel">
        <div id="fieldList" class="field-list"></div>
        <button id="addField" class="secondary add-field-button" type="button">+ Add Another Field</button>
      </section>

      <section class="panel">
        <div class="field-group">
          <label for="loginPagePath">Login page path</label>
          <input id="loginPagePath" type="text" placeholder="/login" />
          <p class="field-help">Auto-fill will only run on this path. Leave it blank to use login-page detection.</p>
        </div>

        <label class="switch-row">
          <span>
            <strong>Auto-fill</strong>
            <small>Use saved credentials when this page loads.</small>
          </span>
          <input id="autoFill" type="checkbox" />
        </label>

        <label class="switch-row">
          <span>
            <strong>Auto-submit</strong>
            <small>Only after both fields are filled safely.</small>
          </span>
          <input id="autoSubmit" type="checkbox" />
        </label>
      </section>

      <div class="actions actions-pill">
        <button id="save">Save for This Site</button>
        <button id="fill" class="secondary">Fill Now</button>
      </div>

      <section class="footer-note">
        <p class="warning">Keyboard shortcut: customize it in Safari Extensions settings.</p>
        <p id="status" class="status">Ready.</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
